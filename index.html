<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mochi Check — mon carnet d'auto-évaluation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFF6FB;--card:#FFFFFF;--ink:#2B1D3A;--muted:#76658A;
  --sakura:#FF86B4;--lemon:#FFE75A;--mint:#7EE3C4;--lilac:#B8A2FF;--sky:#8FD3FF;
  --tone:rgba(43,29,58,.075);--soft:#F6E9F3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--paper:#4A3D66;--card:#5B4C7A;--ink:#FFF4FA;--muted:#E4D6F2;--tone:rgba(255,244,250,.09);--soft:#6A5A8C}
}
:root[data-theme="dark"]{--paper:#4A3D66;--card:#5B4C7A;--ink:#FFF4FA;--muted:#E4D6F2;--tone:rgba(255,244,250,.09);--soft:#6A5A8C}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Arial Rounded MT Bold',system-ui,sans-serif;font-weight:500;font-size:16px;line-height:1.45;
  background-image:radial-gradient(var(--tone) 1.3px,transparent 1.4px),radial-gradient(circle at 8% 0%,rgba(255,134,180,.32),transparent 42%),radial-gradient(circle at 100% 35%,rgba(143,211,255,.32),transparent 42%),radial-gradient(circle at 0% 100%,rgba(126,227,196,.32),transparent 45%),radial-gradient(circle at 95% 95%,rgba(255,231,90,.35),transparent 40%);background-size:13px 13px,100% 100%,100% 100%,100% 100%,100% 100%;-webkit-tap-highlight-color:transparent}
body.dys,body.dys *{font-family:'Lexend',Verdana,sans-serif!important;letter-spacing:.03em;word-spacing:.12em}
h1,h2,h3,.disp{font-family:'Mochiy Pop One','Zen Maru Gothic',system-ui,sans-serif;font-weight:400;margin:0;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px dashed var(--sakura);outline-offset:3px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;width:100%}
textarea{min-height:90px;resize:vertical}
#app{height:100%;max-width:540px;margin:0 auto;display:flex;flex-direction:column;position:relative}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px 6px}
.top h1{font-size:1.25rem;flex:1;text-align:center}
.avatarbtn{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--ink);background:var(--card);display:flex;align-items:center;justify-content:center;overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:4px;border:2.5px solid var(--ink);border-radius:999px;padding:4px 10px;background:var(--lemon);color:#2B1D3A;font-weight:900}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px 28px}
.bottom{display:grid;grid-template-columns:1fr 1fr 96px 1fr 1fr;align-items:end;padding:6px 8px 8px;background:var(--card);border-top:2.5px solid var(--ink)}
.nb{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:700;color:var(--muted);padding:6px 0}
.nb .ic{font-size:1.35rem;line-height:1;filter:grayscale(.6);opacity:.75}
.nb.on{color:var(--ink)}.nb.on .ic{filter:none;opacity:1;transform:scale(1.12)}
.shutter{justify-self:center;width:76px;height:76px;margin-top:-34px;border-radius:50%;background:var(--lemon);border:3px solid #2B1D3A;box-shadow:0 0 0 5px var(--card),0 0 0 8px #2B1D3A;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#2B1D3A}
.shutter b{font-family:'Mochiy Pop One',sans-serif;font-size:.68rem;font-weight:400}
.shutter span{font-size:1.6rem;line-height:1}
.card{background:var(--card);border:2.5px solid var(--ink);border-radius:22px;box-shadow:4px 4px 0 var(--ink);padding:14px;margin:14px 0}
.sec{font-family:'Mochiy Pop One',sans-serif;font-size:1rem;margin:22px 0 8px}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2.5px solid #2B1D3A;border-radius:999px;padding:11px 18px;background:var(--sakura);color:#2B1D3A;font-weight:900;box-shadow:3px 3px 0 #2B1D3A}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #2B1D3A}
.btn.y{background:var(--lemon)}.btn.m{background:var(--mint)}.btn.l{background:var(--lilac)}.btn.w{background:#fff}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;padding:6px 12px;margin:4px 4px 0 0;background:var(--card);font-weight:700;font-size:.9rem}
.chip.on{background:var(--lemon);color:#2B1D3A;border-color:#2B1D3A}
/* bulle manga */
.speech{display:flex;gap:10px;align-items:flex-end;margin-top:6px}
.bubble{position:relative;flex:1;background:var(--card);border:2.5px solid var(--ink);border-radius:20px 20px 20px 4px;padding:12px 14px;font-weight:700}
.bubble small{display:block;font-weight:500;color:var(--muted);margin-top:4px}
/* stories */
.stories{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.st{flex:0 0 auto;width:70px;text-align:center;font-size:.72rem;font-weight:700}
.ring{width:66px;height:66px;border-radius:50%;padding:3px;margin:0 auto 4px;background:var(--soft)}
.ring.on{background:conic-gradient(var(--sakura),var(--lemon),var(--mint),var(--lilac),var(--sakura))}
.ring i{display:flex;width:100%;height:100%;border-radius:50%;align-items:center;justify-content:center;font-style:normal;font-size:1.7rem;border:2.5px solid var(--ink);background:var(--card)}
/* feed */
.snap{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:2px dashed var(--soft)}
.snap:last-child{border-bottom:0}
.snap .bx{width:44px;height:44px;border-radius:14px;border:2.5px solid #2B1D3A;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex:0 0 auto}
.snap p{margin:2px 0 0}
.lv{display:inline-block;font-size:1rem;margin-right:2px}
/* goals */
.goal h3{font-size:1rem;margin:6px 0 4px}
.bar{height:14px;border:2px solid var(--ink);border-radius:999px;background:var(--soft);overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--sakura) 0 8px,#FFA9CB 8px 16px)}
.step{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:7px 0;font-weight:700}
.box{width:26px;height:26px;border:2.5px solid var(--ink);border-radius:8px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--card)}
.step.done span{text-decoration:line-through;color:var(--muted)}
.step.done .box{background:var(--mint)}
.due{font-size:.8rem;font-weight:900;border:2px solid var(--ink);border-radius:8px;padding:1px 7px;background:var(--lemon);color:#2B1D3A}
.due.late{background:#FF9AA8}
/* album */
.seg{display:flex;border:2.5px solid var(--ink);border-radius:999px;overflow:hidden;margin:8px 0 4px}
.seg button{flex:1;padding:9px;font-weight:900}
.seg button.on{background:var(--ink);color:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.slot{aspect-ratio:1/1;border:2.5px dashed var(--muted);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;font-size:.68rem;font-weight:700;text-align:center;padding:4px}
.slot.has{border-style:solid;border-color:var(--ink);background:var(--card)}
.slot.r-r{background:linear-gradient(135deg,#E3F6FF,#F1EBFF)}
.slot.r-l{background:linear-gradient(135deg,#FFF6B8,#FFD3E8,#D9CCFF)}
.dark-txt{color:#2B1D3A}
.stk{font-size:2.3rem;line-height:1;filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(2px 3px 0 rgba(43,29,58,.35))}
.slot .q{font-family:'Mochiy Pop One',sans-serif;font-size:1.6rem;color:var(--muted)}
.cnt{position:absolute;top:4px;right:6px;background:var(--sakura);color:#2B1D3A;border:2px solid #2B1D3A;border-radius:999px;font-size:.65rem;padding:0 5px}
.badge{display:flex;gap:12px;align-items:center;padding:10px;border:2.5px solid var(--ink);border-radius:18px;background:var(--card);margin-bottom:10px}
.badge .em{width:52px;height:52px;flex:0 0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;border:2.5px solid #2B1D3A;background:conic-gradient(var(--lemon),var(--sakura),var(--lilac),var(--lemon))}
.badge.no{opacity:.55}.badge.no .em{background:var(--soft);filter:grayscale(1)}
.packbar{display:flex;align-items:center;gap:12px}
/* moi */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin-top:12px}
.stats div{border:2px solid var(--ink);border-radius:14px;padding:6px 2px;background:var(--soft)}
.stats b{display:block;font-family:'Mochiy Pop One',sans-serif;font-size:1.15rem}
.stats small{font-size:.68rem;font-weight:700}
.sbar{display:grid;grid-template-columns:30px 1fr 44px;gap:8px;align-items:center;margin:8px 0;font-weight:700;font-size:.9rem}
.sbar .bar{margin:0}
.sbar .bar>i{background:var(--c)}
.tl-day{font-family:'Mochiy Pop One',sans-serif;font-size:.85rem;margin:16px 0 4px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* overlays */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;background:var(--paper);background-image:radial-gradient(var(--tone) 1.3px,transparent 1.4px);background-size:13px 13px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.overlay.hidden{display:none}
.ov{max-width:540px;margin:0 auto;padding:12px 18px 40px;min-height:100%;display:flex;flex-direction:column}
.ovtop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.x{width:42px;height:42px;border-radius:50%;border:2.5px solid var(--ink);background:var(--card);font-size:1.2rem;font-weight:900}
.dots{flex:1;display:flex;gap:5px}
.dots i{flex:1;height:6px;border-radius:999px;background:var(--soft);border:1.5px solid var(--ink)}
.dots i.on{background:var(--sakura)}
.bigq{font-size:1.45rem;margin:14px 0 6px}
.subjgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.subj{border:2.5px solid #2B1D3A;border-radius:20px;padding:12px 4px;text-align:center;font-weight:900;font-size:.8rem;color:#2B1D3A;box-shadow:3px 3px 0 #2B1D3A}
.subj span{display:block;font-size:1.9rem;margin-bottom:4px}
.moods{display:flex;justify-content:space-between;gap:6px;margin-top:18px}
.mood{flex:1;border:2.5px solid var(--ink);border-radius:18px;padding:12px 2px;background:var(--card);font-size:.75rem;font-weight:900;text-align:center}
.mood span{display:block;font-size:2rem}
.mood.on{background:var(--lemon);color:#2B1D3A;transform:translateY(-4px) rotate(-3deg);box-shadow:3px 4px 0 var(--ink)}
.skill{margin:12px 0;padding:12px;border:2.5px solid var(--ink);border-radius:18px;background:var(--card)}
.skill b{display:block;margin-bottom:8px}
.lvls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lvb{border:2px solid var(--ink);border-radius:14px;padding:7px 2px;font-size:.66rem;font-weight:900;text-align:center;background:var(--card)}
.lvb span{display:block;font-size:1.3rem}
.lvb.on{background:var(--c);color:#2B1D3A;border-color:#2B1D3A}
.legend{font-size:.75rem;color:var(--muted);margin-top:4px}
.spacer{flex:1}
/* burst / reveal */
.reveal{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;flex:1;padding:20px 0}
.burst{position:absolute;width:520px;height:520px;left:50%;top:44%;margin:-260px 0 0 -260px;border-radius:50%;
  background:repeating-conic-gradient(var(--ink) 0 1.6deg,transparent 1.6deg 11deg);
  -webkit-mask:radial-gradient(circle,transparent 0 96px,#000 100px 200px,transparent 255px);mask:radial-gradient(circle,transparent 0 96px,#000 100px 200px,transparent 255px);
  opacity:.22;animation:spin 22s linear infinite;pointer-events:none}
.reveal > *{position:relative}
.bigstk{font-size:6.5rem;line-height:1;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both;filter:drop-shadow(4px 0 0 #fff) drop-shadow(-4px 0 0 #fff) drop-shadow(0 4px 0 #fff) drop-shadow(0 -4px 0 #fff) drop-shadow(4px 6px 0 rgba(43,29,58,.35))}
.rar{display:inline-block;margin-top:14px;border:2.5px solid #2B1D3A;border-radius:999px;padding:3px 12px;font-weight:900;color:#2B1D3A}
.pack{width:170px;height:220px;border:3px solid #2B1D3A;border-radius:18px;background:
  radial-gradient(circle at 30% 25%,#fff 0 6px,transparent 7px),radial-gradient(circle at 70% 70%,#fff 0 4px,transparent 5px),
  linear-gradient(160deg,var(--sakura),var(--lilac));box-shadow:6px 6px 0 #2B1D3A;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#2B1D3A;animation:shake 1.4s ease-in-out infinite}
.pack .disp{font-size:1.1rem;margin-top:8px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.2) rotate(-25deg);opacity:0}100%{transform:scale(1) rotate(-6deg);opacity:1}}
@keyframes shake{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-5deg)}85%{transform:rotate(5deg)}92%{transform:rotate(-2deg)}}
/* story */
.story{position:fixed;top:0;left:0;right:0;bottom:0;z-index:60;display:flex;flex-direction:column;color:#2B1D3A;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.sbars{display:flex;gap:4px}
.sbars i{flex:1;height:4px;border-radius:4px;background:rgba(43,29,58,.25);overflow:hidden}
.sbars i b{display:block;height:100%;width:0;background:#2B1D3A}
.sbars i.done b{width:100%}
.sbars i.cur b{animation:fill 5s linear forwards}
@keyframes fill{to{width:100%}}
.shead{display:flex;align-items:center;gap:10px;margin:10px 0}
.shead .x{background:#fff;border-color:#2B1D3A;color:#2B1D3A}
.sbody{flex:1;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:1;pointer-events:none}
.sbody .card{background:#fff;color:#2B1D3A;border-color:#2B1D3A;box-shadow:4px 4px 0 #2B1D3A;pointer-events:auto}
.sbody .btn{pointer-events:auto}
.tapz{position:absolute;top:80px;bottom:0;width:38%;z-index:0}
.tapz.l{left:0}.tapz.r{right:0;width:62%}
/* toast */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translate(-50%,-160%);z-index:80;width:min(92vw,480px);transition:transform .35s cubic-bezier(.2,1.4,.4,1)}
#toast.show{transform:translate(-50%,0)}
#toast .t{display:flex;gap:10px;align-items:center;background:var(--card);border:2.5px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--ink);padding:10px 12px;font-weight:700}
#toast .t .e{font-size:1.6rem}
.av{flex:0 0 auto;object-fit:contain;-webkit-user-select:none;user-select:none;filter:drop-shadow(2px 3px 0 rgba(43,29,58,.25))}
.avatarbtn .av{filter:none}
.av-happy{animation:hop 1.2s ease-in-out infinite}
.av-wow{animation:wiggle 1.6s ease-in-out infinite}
.av-sad{filter:saturate(.6) drop-shadow(2px 3px 0 rgba(43,29,58,.25))}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-8px) scale(1.03)}60%{transform:translateY(0) scale(.98,1.02)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.avgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:6px;width:100%;flex:1 1 100%}
@media (min-width:430px){.avgrid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.avtile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 7px;border:2.5px solid var(--soft);border-radius:18px;background:var(--card);font-size:.7rem;font-weight:900}
.avtile img{width:58px;height:58px;object-fit:contain}
.avtile.on{border-color:#2B1D3A;background:var(--lemon);color:#2B1D3A;box-shadow:3px 3px 0 #2B1D3A;transform:rotate(-2deg)}
.avatarbtn{background:var(--lemon)}
#print{display:none}
@media print{
  body{background:#fff;color:#000}
  #app,#overlay,#toast,#story{display:none!important}
  #print{display:block;font-family:'Zen Maru Gothic',sans-serif;color:#000}
  #print h1{font-size:20pt;margin-bottom:4pt}
  #print table{width:100%;border-collapse:collapse;margin:6pt 0 12pt;font-size:10pt}
  #print td,#print th{border:1px solid #999;padding:4pt;text-align:left}
  #print h2{font-size:13pt;margin-top:12pt}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app">
  <header class="top">
    <button class="avatarbtn" data-act="tab" data-tab="moi" aria-label="Mon profil" id="avatar"></button>
    <h1>Mochi Check</h1>
    <span class="pill" id="streak" title="Jours de check d'affilée">🔥 0</span>
    <button class="avatarbtn" id="themebtn" data-act="toggle-theme" aria-label="Basculer clair / sombre" style="font-size:1.25rem"></button>
  </header>
  <main id="view" aria-live="polite"></main>
  <nav class="bottom" aria-label="Navigation">
    <button class="nb" data-act="tab" data-tab="fil"><span class="ic">🏠</span>Mon fil</button>
    <button class="nb" data-act="tab" data-tab="objectifs"><span class="ic">🎯</span>Objectifs</button>
    <button class="shutter" data-act="start-check" aria-label="Faire mon check"><span>✦</span><b>check</b></button>
    <button class="nb" data-act="tab" data-tab="album"><span class="ic">🌟</span>Album</button>
    <button class="nb" data-act="tab" data-tab="moi"><span class="ic">🍡</span>Moi</button>
  </nav>
</div>
<div id="overlay" class="overlay hidden" role="dialog" aria-modal="true"></div>
<div id="story" class="story" style="display:none" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>

function pad(n){ return n<10?'0'+n:''+n; }
function dayKey(d){ d=d||new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseDay(k){ var p=k.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function diffDays(a,b){ return Math.round((parseDay(b)-parseDay(a))/86400000); }
function addDays(n){ var d=new Date(); d.setDate(d.getDate()+n); return dayKey(d); }
function rel(k){ var n=diffDays(k,dayKey()); if(n===0) return 'aujourd’hui'; if(n===1) return 'hier'; if(n<7) return 'il y a '+n+' jours'; var d=parseDay(k); return d.getDate()+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function subj(id){ for(var i=0;i<SUBJ.length;i++) if(SUBJ[i].id===id) return SUBJ[i]; return null; }
/* référentiel : compétences par cycle (c3 = 6e, c4 = 5e-3e), objectifs par compétence + objectifs propres à un niveau (x5, x4, x3) */
(function(){
  function tr(t){ return t.replace(/en anglais/g,'dans la langue').replace(/du monde anglophone/g,'des pays où on parle la langue').replace(/la VO/g,'la langue étudiée').replace(/avec because, I think, in my opinion/g,'avec les expressions d’opinion de la langue'); }
  for(var i=0;i<SUBJ.length;i++){ var s=SUBJ[i];
    if(s.copy){ var src=subj(s.copy); s.c4=[]; for(var a=0;a<src.c4.length;a++){ var it=src.c4[a], t0=it.t||it[0], g0=it.g||it[1], g=[]; for(var b=0;b<g0.length;b++) g.push(tr(g0[b])); s.c4.push([tr(t0),g]); }
      if(!s.x3&&src.x3){ s.x3=[]; for(var c=0;c<src.x3.length;c++) s.x3.push(tr(src.x3[c])); } }
    var cy=['c3','c4'];
    for(var k=0;k<2;k++){ var L=s[cy[k]]; if(!L) continue; var out=[];
      for(var j=0;j<L.length;j++) out.push(L[j].id?L[j]:{id:s.id+'-'+cy[k]+'-'+j,t:L[j][0],g:L[j][1]});

function skillsOf(sid){ var s=subj(sid); return s[cyc()]||s.c4||s.c3||[]; }
function skillObj(sid,id){ var s=subj(sid), all=(s.c3||[]).concat(s.c4||[]); for(var i=0;i<all.length;i++) if(all[i].id===id) return all[i]; return null; }
function skillName(sid,id){ var o=skillObj(sid,id); return o?o.t:'Compétence (ancienne grille)'; }
function progNote(sid){ var s=subj(sid); return (s.p&&s.p[lvlKey()])||''; }
function goalIdeas(sid,skillId){
  var s=subj(sid), L=lvlKey(), r=[], sk=skillsOf(sid), i;
  if(skillId!==''&&skillId!==null&&skillId!==undefined){ var o=skillObj(sid,skillId); if(o) r=r.concat(o.g); }
  else for(i=0;i<sk.length;i++) r.push(sk[i].g[0]);
  var x=s['x'+L.charAt(0)]; if(x) r=(skillId!==''&&skillId!==null&&skillId!==undefined)?r.concat(x):x.concat(r);
  return r;
}

/* ---------- stats ---------- */
function latestLevels(sid){ // {skillIndex: level}
  var res={};
  for(var i=0;i<S.snaps.length;i++){ var s=S.snaps[i]; if(s.subject!==sid) continue;
    for(var j=0;j<s.ratings.length;j++) res[s.ratings[j].k]=s.ratings[j].v; }

  var seen={};

function activeGoals(){ var r=[]; for(var i=0;i<S.goals.length;i++) if(!S.goals[i].done) r.push(S.goals[i]); return r; }
function goalCard(g){
  var sb=subj(g.subject), d=0; for(var i=0;i<g.steps.length;i++) if(g.steps[i].d) d++;
  var pct=g.steps.length?Math.round(d*100/g.steps.length):0, h='';
  var left=diffDays(dayKey(),g.due);
  var dueTxt=g.done?'✔ atteint '+rel(g.doneAt):(left<0?'En retard':(left===0?'Aujourd’hui':'J-'+left));
  h+='<div class="card goal"><div class="row"><span class="chip" style="background:'+sb.c+';color:#2B1D3A;border-color:#2B1D3A;margin:0">'+sb.e+' '+esc(sb.s)+'</span><span class="due'+(!g.done&&left<0?' late':'')+'">'+dueTxt+'</span></div>';
  h+='<h3>'+esc(g.text)+'</h3>'+(g.skill!==null&&g.skill!==undefined&&g.skill!==''?'<div class="muted" style="font-size:.85rem">Compétence : '+esc(skillName(g.subject,g.skill))+'</div>':'');
  h+='<div class="bar" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+pct+'%"></i></div>';
  for(var j=0;j<g.steps.length;j++) h+='<button class="step'+(g.steps[j].d?' done':'')+'" data-act="g-step" data-g="'+g.id+'" data-i="'+j+'"'+(g.done?' disabled':'')+'><span class="box">'+(g.steps[j].d?'✓':'')+'</span><span>'+esc(g.steps[j].t)+'</span></button>';
  h+='<div class="row" style="justify-content:flex-end;margin-top:6px"><button class="chip" data-act="g-del" data-g="'+g.id+'">🗑 Supprimer</button></div></div>';
  return h;
}
function renderGoals(){

function miniChart(sid){
  var sn=snapsOf(sid); if(sn.length<2) return '<p class="muted" style="font-size:.85rem">Il faut au moins 2 checks dans cette matière pour voir ta courbe.</p>';
  var W=300,H=110,P=14, pts=[], sb=subj(sid);
  for(var i=0;i<sn.length;i++){ var t=0; for(var j=0;j<sn[i].ratings.length;j++) t+=sn[i].ratings[j].v; var a=t/sn[i].ratings.length;
    pts.push([P+(W-2*P)*i/(sn.length-1), H-P-(H-2*P)*(a-1)/3]); }
  var d='', c=''; for(var k=0;k<pts.length;k++){ d+=(k?'L':'M')+pts[k][0].toFixed(1)+' '+pts[k][1].toFixed(1); c+='<circle cx="'+pts[k][0].toFixed(1)+'" cy="'+pts[k][1].toFixed(1)+'" r="5" fill="'+sb.c+'" stroke="currentColor" stroke-width="2.5"/>'; }
  var g=''; for(var l=1;l<=4;l++){ var y=H-P-(H-2*P)*(l-1)/3; g+='<line x1="'+P+'" x2="'+(W-P)+'" y1="'+y+'" y2="'+y+'" stroke="currentColor" stroke-opacity=".15" stroke-dasharray="4 5"/><text x="0" y="'+(y+4)+'" font-size="11">'+LEVELS[l-1].e+'</text>'; }
  return '<div style="overflow-x:auto"><svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:420px;color:var(--ink)" role="img" aria-label="Évolution en '+esc(sb.n)+'">'+g+'<path d="'+d+'" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>'+c+'</svg></div>';
}

document.addEventListener('click',function(e){

    case 'ob-color': OB.name=document.getElementById('ob-name').value; OB.color=v; renderOnboard(UI.onboardEdit); break;

      if(wasNew) toast('🎁','Cadeau de bienvenue : 1 pochette !','Va dans Album pour l’ouvrir.'); break;
    case 'edit-profile': renderOnboard(true); break;
    case 'ci-subject': UI.ci.subject=v; UI.ci.step=1; renderCheck(); break;
    case 'ci-mood': UI.ci.mood=+v; renderCheck(); break;
    case 'ci-rate': var k=el.getAttribute('data-k'); if(UI.ci.r[k]===+v) delete UI.ci.r[k]; else UI.ci.r[k]=+v; var y=OV.scrollTop; renderCheck(); OV.scrollTop=y; break;
    case 'ci-next': UI.ci.step++; renderCheck(); break;
    case 'ci-back': var ta=document.getElementById('ci-note'); if(ta) UI.ci.note=ta.value; UI.ci.step--; if(UI.ci.step<0) UI.ci.step=0; renderCheck(); break;
    case 'ci-prompt': var t=document.getElementById('ci-note'); t.value=(t.value?t.value.replace(/\s+$/,'')+'\n':'')+v; t.focus(); break;
    case 'ci-finish': finishCheck(); break;

    case 'g-subj': syncGoalForm(); UI.goal.subject=v; UI.goal.skill=''; renderGoalForm(); break;

    case 'g-save': saveGoal(); break;
    case 'g-step': toggleStep(el.getAttribute('data-g'),+el.getAttribute('data-i')); break;
    case 'g-del':
      if(el.getAttribute('data-sure')){ for(var i=0;i<S.goals.length;i++) if(S.goals[i].id===el.getAttribute('data-g')){ S.goals.splice(i,1); break; } save(); render(); }
      else { el.setAttribute('data-sure','1'); el.textContent='Sûr·e ? Toucher encore'; el.style.background='#FFA3B1'; el.style.color='#2B1D3A'; }
      break;

    case 'set-animal': S.profile.animal=v; S.profile.color=autoColor(v,S.profile.color); save(); render(); toast('💕','Nouveau compagnon !',''); break;
    case 'set-theme': S.settings.theme=v; save(); applySettings(); render(); break;
    case 'set-dys': S.settings.dys=!S.settings.dys; save(); applySettings(); render(); break;
    case 'toggle-theme': S.settings.theme=isDark()?'light':'dark'; save(); applySettings(); render(); break;
    case 'print': printBilan(); break;
    case 'export': openExport(); break;
    case 'copy-export': copyExport(); break;
    case 'dl-export': dlExport(); break;
    case 'import-open': openImport(); break;
    case 'import-do': doImport(); break;
    case 'reset': UI.reset=true; render(); break;
    case 'reset-cancel': UI.reset=false; render(); break;
    case 'reset-confirm': try{ localStorage.removeItem(KEY); }catch(er){} S=defaults(); UI.reset=false; applySettings(); OB={name:'',level:'',color:'#FFFFFF',animal:'chat'}; go('fil'); renderOnboard(false); break;
    case 'story': openStory(el.getAttribute('data-s')); break;
    case 'story-next': storyMove(1); break;
    case 'story-prev': storyMove(-1); break;
    case 'story-close': closeStory(); break;
    case 'story-check': var s1=UI.story.s; closeStory(); startCheck(s1); break;
    case 'story-goal': var s2=UI.story.s; closeStory(); newGoal(s2); break;
  }
});
document.addEventListener('change',function(e){ if(e.target&&e.target.id==='g-skill'&&UI.goal){ syncGoalForm(); renderGoalForm(); } });
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ if(UI.story) closeStory(); else if(OV.className==='overlay'&&S.profile) closeOv(); } });

/* swipe entre onglets */
var sx=0, sy=0;
V.addEventListener('touchstart',function(e){ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
V.addEventListener('touchend',function(e){
  var dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>80&&Math.abs(dy)<50){ var t=e.target; while(t&&t!==V){ if(t.className&&String(t.className).indexOf('stories')>-1) return; t=t.parentNode; }
    var i=TABS.indexOf(UI.tab)+(dx<0?1:-1); if(i>=0&&i<TABS.length) go(TABS[i]); }
},{passive:true});

applySettings(); render();
if(!S.profile) renderOnboard(false);
})();
</script>
